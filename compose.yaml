services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OMNIFORM_LLM_PROVIDER: ${OMNIFORM_LLM_PROVIDER:-groq}
      OMNIFORM_GROQ_MODEL: ${OMNIFORM_GROQ_MODEL:-llama-3.3-70b-versatile}
      OMNIFORM_CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - omniform_outputs:/app/outputs
    restart: unless-stopped

  frontend:
    build: .
    environment:
      OMNIFORM_API_URL: http://backend:8000
      CONTENT_FORGE_ACCESS_CODE: ${CONTENT_FORGE_ACCESS_CODE:?Set CONTENT_FORGE_ACCESS_CODE}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      AI_PROVIDER: demo
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  omniform_outputs:
